name: Test API

on:
  pull_request:
    branches:
      - main  # Change this to your default branch

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '9.0.x'  # Use the appropriate version for your project

    - name: Restore dependencies
      run: dotnet restore leaguerAPI.Tests/leaguerAPI.Tests.csproj

    - name: Build
      run: dotnet build leaguerAPI.Tests/leaguerAPI.Tests.csproj --no-restore

    - name: Test
      run: dotnet test leaguerAPI.Tests/leaguerAPI.Tests.csproj --no-build --verbosity normal
